name: Build & Release Windows executable

# Baut watchdog.exe per PyInstaller auf dem self-hosted Windows-Runner (mfbotbt) und
# legt/aktualisiert danach den zum Tag passenden Forgejo-Release samt Watchdog.exe-Anhang.
#
# Build und Release-Erstellung laufen bewusst in getrennten Jobs (analog zu
# DasAoD/vpn-ip-checker): der Release-Schritt (curl gegen die Forgejo-API) läuft auf dem
# Linux-Runner (vpn-runner, Label ubuntu-latest) statt auf dem Windows-Runner, damit er
# ganz normales bash/curl nutzen kann - keine Abhängigkeit von einer bestimmten
# PowerShell-Version auf mfbotbt.
#
# Voraussetzungen:
# - Runner "mfbot-runner" (windows-latest) und "vpn-runner" (ubuntu-latest) müssen online sein
# - mfbotbt braucht Internetzugriff zu code.forgejo.org (Checkout-/Artifact-Actions-Mirror)
#   und git.uliana.de; Python muss dort bereits installiert sein (vorhanden: 3.11.9)
# - Der eingebaute Token (secrets.GITHUB_TOKEN) hat auf dem eigenen, nicht-geforkten Repo
#   standardmäßig Schreibzugriff - keine zusätzliche Einstellung nötig

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build watchdog.exe
        run: pyinstaller watchdog.spec --noconfirm

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: Watchdog
          path: dist/Watchdog.exe

  release:
    name: Create Forgejo release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: Watchdog
          path: dist/

      - name: Create/update release and upload Watchdog.exe
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Release für diesen Tag suchen, sonst neu anlegen
          RELEASE_ID=$(curl -s "${API}/releases/tags/${TAG}" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(curl -s -X POST "${API}/releases" \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\": \"${TAG}\", \"name\": \"watchdog ${TAG}\", \"body\": \"Automatisch gebaut von Forgejo Actions für ${TAG}.\", \"draft\": false}" \
              | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi

          curl -s -X POST \
            "${API}/releases/${RELEASE_ID}/assets?name=Watchdog.exe" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"dist/Watchdog.exe"
